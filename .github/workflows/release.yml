name: Release

# On a version tag (vX.Y.Z): check that the tag matches the code, publish the Docker image to
# ghcr.io/simonseifert/merlin-mcp (amd64 and arm64), and create the GitHub release from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Tag matches the code
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$v"
          grep -q "^## $v (" CHANGELOG.md
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v (" 'index($0,h)==1{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
